name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run tests as an unprivileged user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c "cd '$GITHUB_WORKSPACE' && swift test"

  macos:
    name: macOS app, tests and DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug, with tests)
        timeout-minutes: 20
        run: swift build --build-tests
      - name: Test
        timeout-minutes: 10
        run: swift test --skip-build
      - name: Build release app (arm64)
        timeout-minutes: 20
        run: scripts/build-release.sh
      - name: Package and verify DMG
        timeout-minutes: 10
        run: scripts/package-dmg.sh
      - name: Launch smoke test and screenshots
        timeout-minutes: 8
        run: |
          swiftc -O scripts/ci/window-info.swift -o window-info
          shoot() {
            local route="$1" appearance="$2"
            defaults write app.spacesweep.mac SpaceSweepAutoScan -bool YES
            defaults write app.spacesweep.mac SpaceSweepInitialRoute -string "$route"
            defaults write app.spacesweep.mac appearance -string "$appearance"
            open dist/SpaceSweep.app
            sleep 15
            pgrep -x SpaceSweep >/dev/null || { echo "::error::SpaceSweep is not running ($route)"; exit 1; }
            local bounds; bounds="$(./window-info | head -1)"
            echo "✓ SpaceSweep is running ($route, $appearance) — window: ${bounds:-not found}"
            if [[ -n "$bounds" ]]; then
              screencapture -x -o -R"$bounds" "screenshot-$route-$appearance.png" || true
              if [[ -f "screenshot-$route-$appearance.png" ]]; then
                sips -Z 520 -s format jpeg -s formatOptions 40 "screenshot-$route-$appearance.png" --out "thumb.jpg" >/dev/null
                echo "THUMB-$route-$appearance $(stat -f%z thumb.jpg) $(base64 -i thumb.jpg | tr -d '\n')"
              fi
            fi
            pkill -x SpaceSweep || true
            sleep 2
          }
          shoot overview light
          shoot results dark
          shoot developer light
          echo "── App diagnostics (no paths) ──"
          log show --last 5m --style compact --predicate 'subsystem == "app.spacesweep.mac"' | tail -20 || true
          defaults delete app.spacesweep.mac || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpaceSweep-AppleSilicon
          path: |
            dist/SpaceSweep-AppleSilicon.dmg
            dist/build-info.txt
            screenshot-*.png
          if-no-files-found: warn
